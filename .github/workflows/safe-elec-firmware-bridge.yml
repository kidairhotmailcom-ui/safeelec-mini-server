name: SAFE-ELEC Mini Server Firmware Relay Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'tests/test_firmware_bridge.py'
      - 'requirements.txt'
      - '.github/workflows/safe-elec-firmware-bridge.yml'
  push:
    branches: [feature/jarvis-firmware-bridge-20261121]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile main.py tests/test_firmware_bridge.py
      - name: Run firmware bridge tests
        run: python -m unittest discover -s tests -t . -v
