name: SAFE-ELEC Python syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - work/safe-elec-api-v1-foundation

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend
        run: python -m py_compile main.py
