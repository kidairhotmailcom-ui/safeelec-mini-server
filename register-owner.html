<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนเจ้าของหอพัก</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 20px; }
    .container { max-width: 420px; margin: 40px auto; }
    .card {
      background: white; padding: 32px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 { color: #1e40af; margin-bottom: 8px; font-size: 22px; text-align: center; }
    p { color: #6b7280; margin-bottom: 24px; text-align: center; }
    label { display: block; margin-bottom: 6px; font-weight: 500; color: #374151; font-size: 14px; }
    input {
      width: 100%; padding: 12px; margin-bottom: 16px;
      border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px;
    }
    .btn-primary {
      width: 100%; padding: 12px; background: #1e40af; color: white;
      border: none; border-radius: 8px; font-size: 16px;
      cursor: pointer; font-weight: 500;
    }
    .btn-primary:disabled { opacity: .6; cursor: wait; }
    .btn-back {
      display: inline-block; margin-top: 16px; color: #6b7280;
      text-decoration: none; font-size: 14px; text-align: center; width: 100%;
    }
    #message {
      display: none; margin: 0 0 16px; padding: 12px;
      border-radius: 8px; font-size: 14px; white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    #message.error { display: block; background: #fef2f2; color: #991b1b; }
    #message.success { display: block; background: #ecfdf5; color: #065f46; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🏢 ลงทะเบียนเจ้าของหอพัก</h1>
      <p>กรอกข้อมูลเพื่อสร้างบัญชีของคุณ</p>
      <div id="message" role="status" aria-live="polite"></div>
      <form id="register-form">
        <label for="dorm-name">ชื่อหอพัก</label>
        <input type="text" id="dorm-name" required maxlength="150"
               placeholder="เช่น หอพักสุขสบาย">
        <label for="owner-name">ชื่อ-นามสกุล ผู้ดูแล</label>
        <input type="text" id="owner-name" required maxlength="150"
               placeholder="กรุณากรอกชื่อของคุณ">
        <label for="owner-email">อีเมล</label>
        <input type="email" id="owner-email" required autocomplete="email"
               placeholder="example@email.com">
        <label for="owner-phone">เบอร์โทรศัพท์</label>
        <input type="tel" id="owner-phone" required maxlength="30"
               autocomplete="tel" placeholder="08x-xxx-xxxx">
        <label for="owner-pass">ตั้งรหัสผ่าน</label>
        <input type="password" id="owner-pass" required minlength="6"
               autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร">
        <label for="owner-pass2">ยืนยันรหัสผ่าน</label>
        <input type="password" id="owner-pass2" required minlength="6"
               autocomplete="new-password" placeholder="กรอกรหัสผ่านอีกครั้ง">
        <button class="btn-primary" id="submit-btn" type="submit">
          ✅ สมัครสมาชิก
        </button>
      </form>
      <a href="index.html" class="btn-back">← กลับหน้าหลัก</a>
    </div>
  </div>
  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL = 'https://bhihjcstmamwoinmbfiy.supabase.co';
    const SUPABASE_ANON_KEY =
      'sb_publishable_HzzSGnnXK1FqstRvaCXh_w_15b_1Cms';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById('register-form');
    const button = document.getElementById('submit-btn');
    const message = document.getElementById('message');
    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
      message.style.display = 'block';
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const dormName = document.getElementById('dorm-name').value.trim();
      const ownerName = document.getElementById('owner-name').value.trim();
      const email = document.getElementById('owner-email').value.trim().toLowerCase();
      const phone = document.getElementById('owner-phone').value.trim();
      const password = document.getElementById('owner-pass').value;
      const password2 = document.getElementById('owner-pass2').value;
      if (!dormName || !ownerName || !email || !phone || !password || !password2) {
        showMessage('กรุณากรอกข้อมูลให้ครบทุกช่อง', 'error');
        return;
      }
      if (password.length < 6) {
        showMessage('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
        return;
      }
      if (password !== password2) {
        showMessage('รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error');
        return;
      }
      button.disabled = true;
      button.textContent = 'กำลังสร้างบัญชี...';
      message.style.display = 'none';
      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              dorm_name: dormName,
              owner_name: ownerName,
              owner_phone: phone
            },
          emailRedirectTo: 'https://kidairhotmailcom-ui.github.io/safeelec-mini-server/index.html'
        });
        if (error) throw error;
        if (!data.user) {
          throw new Error('Supabase ไม่ได้ส่งข้อมูลบัญชีกลับมา กรุณาลองใหม่');
        }
        if (!data.session) {
          showMessage(
            'สร้างคำขอสมัครสมาชิกแล้ว\n' +
            'กรุณาตรวจสอบอีเมลเพื่อยืนยันบัญชี ก่อนกลับไปเข้าสู่ระบบ\n' +
            'หากไม่มีอีเมล ให้ตรวจสอบโฟลเดอร์สแปมด้วย',
            'success'
          );
          form.reset();
          return;
        }
        showMessage('สมัครสมาชิกสำเร็จ กำลังไปหน้าหลัก...', 'success');
        window.location.replace('index.html');
      } catch (error) {
        console.error('Registration error:', error);
        showMessage(
          'สมัครสมาชิกไม่สำเร็จ\n' +
          (error?.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่'),
          'error'
        );
      } finally {
        button.disabled = false;
        button.textContent = '✅ สมัครสมาชิก';
      }
    });
  </script>
</body>
</html>
