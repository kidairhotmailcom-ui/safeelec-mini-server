version: 2.1

jobs:
  validate-python-server:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install declared Python dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
      - run:
          name: Check dependency consistency
          command: python -m pip check
      - run:
          name: Compile the active Flask server source
          command: python -m py_compile main.py
      - run:
          name: Smoke-test the Flask health endpoint
          command: >-
            python -c 'from main import app; client = app.test_client();
            response = client.get("/health"); payload = response.get_json();
            assert response.status_code == 200 and payload and
            payload.get("ok") is True and payload.get("service") == "SAFE-ELEC",
            (response.status_code, payload);
            print("SAFE-ELEC Flask import and health smoke test passed")'
      - run:
          name: Smoke-test authenticated AUTO IoT read-only endpoint
          command: >-
            python -c 'import main; main.JARVIS_INTEGRATION_TOKEN = "circleci-read-only-test-token"; client = main.app.test_client();
            response = client.get("/api/jarvis/v1/auto-iot/health", headers={"X-Jarvis-Integration-Token": "circleci-read-only-test-token"});
            payload = response.get_json();
            assert response.status_code == 200 and payload and payload.get("ok") is True and
            payload.get("service") == "AUTO IoT PRO" and payload.get("read_only") is True and
            payload.get("iot_project_connected") is False,
            (response.status_code, payload);
            print("AUTO IoT read-only integration endpoint smoke test passed; separate IoT Core binding remains explicitly unconfigured")'
      - run:
          name: Report validation scope
          command: |
            echo "Python dependency installation: passed"
            echo "Active Flask source compilation: passed"
            echo "Flask health endpoint smoke test: passed"
            echo "Legacy server.js is not compiled as Node.js; it is a separate legacy Python file."
            echo "This pipeline does not claim ESP firmware OTA or hardware validation."

workflows:
  safe_elec_server_ci:
    jobs:
      - validate-python-server
