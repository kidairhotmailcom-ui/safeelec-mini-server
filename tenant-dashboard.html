<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อมูลผู้เช่า</title>
  <!-- ===== Supabase CDN ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 🔑 ใส่ URL และ Key เหมือนในหน้าอื่นๆ ของคุณ
    const SUPABASE_URL = "ใส่ SUPABASE_URL ของคุณ";
    const SUPABASE_KEY = "ใส่ SUPABASE_ANON_KEY ของคุณ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { background: #f0f4f8; padding: 20px; }
    .container { max-width: 450px; margin: 40px auto; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { color: #1e40af; font-size: 22px; margin-bottom: 20px; text-align: center; }
    .info-box { background: #eff6ff; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .info-box h3 { font-size: 14px; color: #3b82f6; margin-bottom: 8px; }
    .info-box p { font-size: 18px; font-weight: bold; color: #1e40af; }
    .total { color: #dc2626; font-size: 20px; }
    .btn-logout { width: 100%; padding: 12px; background: #ef4444; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .loading { text-align: center; color: #6b7280; padding: 20px; }
    .status-pending { color: #f59e0b; }
    .status-paid { color: #16a34a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>📋 ข้อมูลห้องพัก</h1>
      
      <div id="loading" class="loading">กำลังโหลดข้อมูล...</div>
      
      <div id="info-content" style="display: none;">
        <div class="info-box">
          <h3>หมายเลขห้อง</h3>
          <p id="show-room">-</p>
        </div>
        <div class="info-box">
          <h3>ชื่อผู้เช่า</h3>
          <p id="show-name">-</p>
        </div>
        <div class="info-box">
          <h3>สถานะบิลล่าสุด</h3>
          <p id="show-status">-</p>
        </div>
        <div class="info-box">
          <h3>ค่าเช่าห้อง</h3>
          <p id="show-room-price">-</p>
        </div>
        <div class="info-box">
          <h3>ค่าน้ำ</h3>
          <p id="show-water-price">-</p>
        </div>
        <div class="info-box">
          <h3>ค่าไฟ</h3>
          <p id="show-electric-price">-</p>
        </div>
        <div class="info-box">
          <h3>เดือน/ปี</h3>
          <p id="show-month">-</p>
        </div>
        <div class="info-box">
          <h3>ยอดรวมที่ต้องชำระ</h3>
          <p class="total" id="show-total">-</p>
        </div>
      </div>
      
      <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>

  <script>
    let currentTenant = null;

    async function loadInfo() {
      // ตรวจสอบการเข้าสู่ระบบ
      currentTenant = JSON.parse(localStorage.getItem('current_tenant') || 'null');
      if (!currentTenant) {
        alert('กรุณาเข้าสู่ระบบก่อน');
        window.location.href = 'customer-login.html';
        return;
      }

      // แสดงข้อมูลพื้นฐานทันที
      document.getElementById('show-room').textContent = currentTenant.roomId;
      document.getElementById('show-name').textContent = currentTenant.name;

      try {
        // ดึงบิลล่าสุดของห้องนี้จาก Supabase
        const { data: bills, error: billError } = await supabase
          .from('dorm_bills')
          .select('*')
          .eq('room_id', currentTenant.roomId)
          .order('created_at', { ascending: false })
          .limit(1);

        if (billError) throw billError;

        // ซ่อนโหลด แสดงเนื้อหา
        document.getElementById('loading').style.display = 'none';
        document.getElementById('info-content').style.display = 'block';

        if (!bills || bills.length === 0) {
          document.getElementById('show-status').textContent = 'ไม่มีบิล';
          document.getElementById('show-status').style.color = '#6b7280';
          document.getElementById('show-room-price').textContent = '-';
          document.getElementById('show-water-price').textContent = '-';
          document.getElementById('show-electric-price').textContent = '-';
          document.getElementById('show-month').textContent = '-';
          document.getElementById('show-total').textContent = '-';
          return;
        }

        // มีบิล — แสดงข้อมูลล่าสุด
        const bill = bills[0];

        // แสดงสถานะ
        const statusEl = document.getElementById('show-status');
        if (bill.status === 'รอชำระ') {
          statusEl.textContent = '⏳ รอชำระ';
          statusEl.className = 'status-pending';
        } else if (bill.status === 'รอตรวจสอบ') {
          statusEl.textContent = '⏳ รอเจ้าของตรวจสอบ';
          statusEl.style.color = '#3b82f6';
        } else if (bill.status === 'ชำระแล้ว') {
          statusEl.textContent = '✅ ชำระแล้ว';
          statusEl.className = 'status-paid';
        } else {
          statusEl.textContent = bill.status;
        }

        // แสดงค่าต่างๆ
        document.getElementById('show-room-price').textContent = formatNumber(bill.rent) + ' บาท';
        document.getElementById('show-water-price').textContent = formatNumber(bill.water_total) + ' บาท';
        document.getElementById('show-electric-price').textContent = formatNumber(bill.electric_total) + ' บาท';
        document.getElementById('show-month').textContent = bill.month || '-';
        document.getElementById('show-total').textContent = formatNumber(bill.total) + ' บาท';

      } catch (e) {
        console.error('โหลดข้อมูลไม่สำเร็จ:', e);
        document.getElementById('loading').innerHTML = '❌ โหลดข้อมูลไม่สำเร็จ<br>กดรีเฟรชหน้าใหม่';
        alert('⚠️ ไม่สามารถโหลดข้อมูลได้: ' + e.message);
      }
    }

    function formatNumber(num) {
      if (!num && num !== 0) return '0';
      return Number(num).toLocaleString('th-TH');
    }

    function logout() {
      localStorage.removeItem('current_tenant');
      window.location.href = 'customer-login.html';
    }

    // เรียกใช้งาน
    loadInfo();
  </script>
</body>
</html>
